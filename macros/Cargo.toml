[package]
name = "good-ormning-macros"
version = "0.1.0"
edition = "2021"

[lib]
proc-macro = true

[features]
default = ["pg", "sqlite"]
pg = []
sqlite = []

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
sqlparser = "0.52"
convert_case = "0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
good-ormning-core = { path = "../core" }

[lints.clippy]
all = "allow"
