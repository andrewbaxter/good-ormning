[package]
name = "good-ormning"
version = "0.4.1"
edition = "2021"
license = "ISC"
description = "Maybe an ORM"
homepage = "https://github.com/andrewbaxter/good-ormning"
repository = "https://github.com/andrewbaxter/good-ormning"
readme = "readme.md"

[features]
default = []
chrono = ["dep:chrono", "good-ormning-core/chrono"]
jiff = ["dep:jiff", "good-ormning-core/jiff"]
pg = ["dep:tokio-postgres"]
sqlite = ["dep:rusqlite"]

[dependencies]
chrono = { version = "0.4", optional = true, features = ["serde"] }
jiff = { version = "0.2", optional = true, features = ["serde"] }
enum_dispatch = "0.3"
flowcontrol = "0.2.2"
genemichaels-lib = "0.5.0-pre3"
hex = "0.4"
proc-macro2 = "1"
quote = "1"
rpds = "1"
dyn-clone = "1.0"
samevariant = "0.0"
stable-hash = "0.4"
syn = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", optional = true, features = [
    "array",
    "bundled",
] }
tokio-postgres = { version = "0.7", optional = true }
async-trait = "0.1"
loga = "0.4"
sqlparser = "0.52"
good-ormning-core = { path = "core" }
good-ormning-macros = { path = "macros" }

[workspace]
members = ["integration_tests", "macros"]

[dev-dependencies]
rusqlite = "0.37"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
all = "allow"
