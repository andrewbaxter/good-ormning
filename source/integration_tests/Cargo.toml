[package]
name = "integration_tests"
version = "0.6.0"
edition = "2021"
publish = false

[dependencies]
chrono = ">=0"
jiff = ">=0"
rusqlite = ">=0"
tokio = { version = ">=0", features = ["macros", "rt"] }
"good-ormning" = { path = "..", features = [
    "chrono",
    "pg",
    "sqlite",
    "mariadb",
    "jiff",
    "import",
    "deadpool",
] }
"good-ormning-macros" = { path = "../macros" }
tokio-postgres = { version = ">=0", features = [
    "with-chrono-0_4",
    "with-jiff-0_2",
] }
loga = ">=0"
good-ormning-core = { version = "0.8.0", path = "../core" }
flowcontrol = ">=0"
tempfile = "3.27.0"
pglite-oxide = { git = "https://github.com/f0rr0/pglite-oxide", rev = "f5cb76cfbf8a513307fe6b343556b58c81e599cf" }
deadpool-postgres = { version = "0.14", features = ["rt_tokio_1"] }
deadpool-sqlite = { version = "0.14", features = ["rt_tokio_1"] }

[dev-dependencies]
syn = { version = "3", features = ["full"] }
serde_json = "1"

[build-dependencies]
"good-ormning" = { path = "..", features = [
    "chrono",
    "jiff",
    "pg",
    "sqlite",
    "mariadb",
] }
flowcontrol = ">=0"

[lints.clippy]
all = "allow"
