[workspace]
members = ["integration_tests", "macros", "core"]
package.license = "ISC"
package.description = "Maybe an ORM"
package.homepage = "https://github.com/andrewbaxter/good-ormning"
package.repository = "https://github.com/andrewbaxter/good-ormning"
package.readme = "../readme.md"

[package]
name = "good-ormning"
version = "0.8.0"
edition = "2021"
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
chrono = [
    "dep:chrono",
    "good-ormning-core/chrono",
    "good-ormning-macros/chrono",
]
jiff = ["dep:jiff", "good-ormning-core/jiff", "good-ormning-macros/jiff"]
pg = ["dep:tokio-postgres"]
mariadb = ["dep:mysql_async"]
sqlite = ["dep:rusqlite"]
deadpool = ["dep:deadpool-postgres", "pg"]
import = [
    "dep:aargvark",
    "dep:tokio",
    "dep:loga",
    "dep:sqlparser",
    "pg",
    "sqlite",
    "mariadb",
    "chrono",
    "jiff",
]

[dependencies]
chrono = { version = "0.4", optional = true, features = ["serde"] }
jiff = { version = "0.2", optional = true, features = ["serde"] }
genemichaels-lib = "0.12.0"
proc-macro2 = "1"
quote = "1"
rpds = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", optional = true, features = [
    "array",
    "bundled",
] }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
mysql_async = { version = "0.37", optional = true, default-features = false, features = [
    "minimal-rust",
] }
async-trait = "0.1"
aargvark = { version = "0.13", optional = true }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
], optional = true }
loga = { version = "0.5", optional = true }
sqlparser = { version = "0.63.0", optional = true }
convert_case = "0.12.0"
good-ormning-core = { version = "0.8.0", path = "core" }
good-ormning-macros = { version = "0.8.0", path = "macros" }

[[bin]]
name = "good-ormning-import"
path = "src/import/main.rs"
required-features = ["import"]

[dev-dependencies]
rusqlite = "0.40"

[package.metadata.docs.rs]
all-features = true

[lints.clippy]
all = "allow"
