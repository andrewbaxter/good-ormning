[package]
name = "good-ormning-core"
version = "0.5.8"
edition = "2021"
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[features]
default = []
chrono = ["dep:chrono"]
jiff = ["dep:jiff"]

[dependencies]
chrono = { version = "0.4", optional = true, features = ["serde"] }
jiff = { version = "0.2", optional = true, features = ["serde"] }
enum_dispatch = "0.3"
flowcontrol = "0.2.2"
hex = "0.4"
proc-macro2 = "1"
quote = "1"
rpds = "1"
dyn-clone = "1.0"
samevariant = "0.0"
stable-hash = "0.4"
syn = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
loga = "0.4"
sqlparser = "0.52"
convert_case = "0.7.1"

[lints.clippy]
all = "allow"
