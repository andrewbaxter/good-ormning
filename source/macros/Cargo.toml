[package]
name = "good-ormning-macros"
version = "0.7.0"
edition = "2021"
license.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true

[lib]
proc-macro = true

[features]
default = ["mariadb", "pg", "sqlite"]
mariadb = []
pg = []
sqlite = []
chrono = ["good-ormning-core/chrono"]
jiff = ["good-ormning-core/jiff"]

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
sqlparser = "0.63.0"
convert_case = "0.12"
hex = "0.4"
serde_json = "1"
good-ormning-core = { version = "0.7.0", path = "../core" }

[lints.clippy]
all = "allow"
